[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-llm-qlora"
version = "0.1.0"
description = "Reproducible Llama-3 8B QLoRA training and medical QA evaluation"
requires-python = ">=3.10,<3.13"
dependencies = [
  "datasets>=3.0,<5",
  "transformers>=4.50,<5",
  "accelerate>=1.2,<2",
  "peft>=0.14,<1",
  "trl>=0.15,<1",
  "bitsandbytes>=0.45,<1",
  "evaluate>=0.4,<1",
  "rouge-score>=0.1.2,<1",
  "bert-score>=0.3.13,<1",
  "pyyaml>=6.0,<7",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
